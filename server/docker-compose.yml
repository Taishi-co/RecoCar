services:
  postgres:
    image: postgres:16-alpine
    container_name: recocar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recocar}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - recocar-postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recocar}"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: recocar-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-recocar}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET:?POSTGREST_JWT_SECRET is required}
      PGRST_SERVER_PORT: 3000

  postgrest-proxy:
    image: nginx:1.27-alpine
    container_name: recocar-postgrest-proxy
    restart: unless-stopped
    depends_on:
      - postgrest
    volumes:
      - ./postgrest/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  recocar-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: recocar-api:latest
    container_name: recocar-api
    restart: unless-stopped
    depends_on:
      - postgrest-proxy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://car.recolink.cn}
      LOCAL_UPLOAD_DIR: /app/uploads
      COZE_SUPABASE_URL: http://postgrest-proxy:8000
      COZE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY is required}
      COZE_SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
    ports:
      - "127.0.0.1:34532:34532"
    volumes:
      - recocar-uploads:/app/uploads

volumes:
  recocar-postgres-data:
  recocar-uploads:
