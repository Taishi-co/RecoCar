server {
  listen 8000;
  server_name _;

  location = /health {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /rest/v1/ {
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://postgrest:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }
}
